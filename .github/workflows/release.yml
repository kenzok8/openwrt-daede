name: Build candidate matrix

# 纯构建矩阵，不发布。发布唯一入口是 promote-candidate.yml。
# gate 用 --ref candidate/<SHA> 触发并传 sha，保证构建发生在候选上；
# 不传 sha 时退化成“在触发 ref 上单架构试编”，代替原 test-daed-build。
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Candidate SHA to build and verify; empty = trigger ref (branch iteration)'
        type: string
        required: false
        default: ''
      arch:
        description: Architecture; all = release matrix
        type: choice
        required: false
        default: all
        options:
          - all
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a9
          - arm_cortex-a9_neon
          - i386_pentium4
          - x86_64
      sdk:
        description: SDK version; all = release matrix
        type: choice
        required: false
        default: all
        options:
          - all
          - "24.10"
          - "25.12"
      packages:
        description: Space separated packages to require
        type: string
        required: false
        default: dae daed luci-app-daede vmlinux-btf
      golang_branch:
        description: Golang feed branch (kenzok8/golang)
        type: choice
        required: false
        default: "1.27"
        options:
          - "1.27"
          - "1.26"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }} · SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch == 'all' && '["aarch64_cortex-a53","aarch64_cortex-a72","aarch64_generic","arm_cortex-a7_neon-vfpv4","arm_cortex-a9","arm_cortex-a9_neon","i386_pentium4","x86_64"]' || format('["{0}"]', inputs.arch)) }}
        sdk: ${{ fromJSON(inputs.sdk == 'all' && '["24.10","25.12"]' || format('["{0}"]', inputs.sdk)) }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha != '' && inputs.sha || github.ref }}

      - name: Prepare SDK action with pahole
        uses: actions/checkout@v7
        with:
          repository: kenzok8/gh-action-sdk
          ref: 44f98c51d04aebd1aa79fe4f603559c1ec2085da
          path: .github/actions/gh-action-sdk
          persist-credentials: false

      - name: Add pahole to SDK image
        run: git -C .github/actions/gh-action-sdk apply "$GITHUB_WORKSPACE/.github/patches/gh-action-sdk-pahole.patch"

      # Heavy dae/daed + Go toolchain builds can exhaust the runner's ~14GB.
      # Drop preinstalled toolchains we never use to reclaim ~25GB and avoid
      # "No space left on device" on the largest jobs (e.g. aarch64 SDK 25.12).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/.ghcup 2>/dev/null || true
          sudo docker image prune -af || true
          df -h /

      - name: Build packages
        id: sdk
        continue-on-error: true
        uses: ./.github/actions/gh-action-sdk
        env:
          CONTAINER: immortalwrt/sdk
          ARCH: ${{ matrix.arch }}-openwrt-${{ matrix.sdk }}
          FEEDNAME: daede
          PACKAGES: ${{ inputs.packages }}
          # wall supplies v2ray-geoip / v2ray-geosite (subpackages of v2ray-geodata)
          EXTRA_FEEDS: src-git|wall|https://github.com/kenzok8/wall
          NO_REFRESH_CHECK: true
          IGNORE_ERRORS: false
          INDEX: 1
          # Candidate builds use disposable SDK index keys. The unified feed
          # signs its own indexes after the exact package bytes pass validation.
          # 此 workflow 只做候选构建，永不带发布密钥签名。
          KEY_BUILD: ''
          PRIVATE_KEY: ''
          # dae / daed go.mod requires Go 1.27; override SDK's bundled golang.
          GOLANG_REPO: https://github.com/kenzok8/golang
          GOLANG_BRANCH: ${{ inputs.golang_branch }}

      - name: Require requested packages
        if: always()
        env:
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          [ "$SDK_OUTCOME" = success ] || {
            echo "::error::SDK action concluded $SDK_OUTCOME"
            exit 1
          }
          output_dir="bin/packages/${{ matrix.arch }}/daede"
          read -r -a requested <<< "$PACKAGES"
          [ "${#requested[@]}" -gt 0 ] || { echo "::error::packages input is empty"; exit 1; }
          for package in "${requested[@]}"; do
            found=0
            while IFS= read -r -d '' file; do
              name=${file##*/}
              case "$name" in
                "$package"-*.apk|"$package"_*.apk|"$package"-*.ipk|"$package"_*.ipk)
                  found=1
                  break
                  ;;
              esac
            done < <(find "$output_dir" -maxdepth 1 -type f \( -name '*.apk' -o -name '*.ipk' \) -print0 2>/dev/null || true)
            [ "$found" -eq 1 ] || {
              echo "::error::$package has no package for ${{ matrix.arch }} SDK ${{ matrix.sdk }}"
              exit 1
            }
          done

      - name: Collect packages
        run: |
          ARCH="${{ matrix.arch }}"
          mkdir -p dist/release dist/feed
          FEED_DIR="bin/packages/${ARCH}/daede"

          for f in "$FEED_DIR"/*.ipk; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in Packages*) continue ;; esac
            base=$(basename "$f" .ipk)
            safe="${base//\~/.}"
            cp -v "$f" "dist/release/${safe}.ipk"
            cp -v "$f" dist/feed/
          done

          for f in "$FEED_DIR"/*.apk; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in Packages*|APKINDEX*|packages.adb*) continue ;; esac
            base=$(basename "$f" .apk)
            safe="${base//\~/.}"
            # noarch APK 不带架构后缀，补上以区分 SDK/arch
            if echo "$safe" | grep -q "_${ARCH}\$"; then
              cp -v "$f" "dist/release/${safe}.apk"
            else
              cp -v "$f" "dist/release/${safe}-${ARCH}.apk"
            fi
            cp -v "$f" dist/feed/
          done

          for f in "$FEED_DIR"/Packages* "$FEED_DIR"/APKINDEX* "$FEED_DIR"/packages.adb*; do
            [ -f "$f" ] || continue
            cp -v "$f" dist/feed/
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: packages-sdk${{ matrix.sdk }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-sdk${{ matrix.sdk }}-${{ matrix.arch }}
          path: |
            logs/**
            *.log
            **/*.log
          if-no-files-found: ignore

  verify:
    name: Verify built packages
    needs: build
    # 只在完整发布矩阵上跑硬校验；单架构迭代不跑（每目标那里已经 fail-closed）。
    if: inputs.arch == 'all' && inputs.sdk == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: packages-*

      - name: Require all packages on supported targets
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -eu
          fail=0
          read -r -a requested <<< "$PACKAGES"
          for sdk in 24.10 25.12; do
            for arch in aarch64_cortex-a53 aarch64_cortex-a72 aarch64_generic arm_cortex-a7_neon-vfpv4 arm_cortex-a9 arm_cortex-a9_neon i386_pentium4 x86_64; do
              dir="artifacts/packages-sdk${sdk}-${arch}/feed"
              for pkg in "${requested[@]}"; do
                if ls "$dir"/${pkg}_*.ipk >/dev/null 2>&1 || ls "$dir"/${pkg}-*.apk >/dev/null 2>&1; then
                  :
                else
                  echo "MISSING: $pkg for $arch (SDK $sdk)"; fail=1
                fi
              done
            done
          done
          [ "$fail" -eq 0 ] || { echo "verify failed; feed will not be published"; exit 1; }
          echo "all required release packages present"
