name: Sync and release dae/daed

# Scheduled runs build and promote a fully validated candidate.
# Manual runs stop after candidate validation for router testing.

on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '30 19 * * 0'
  workflow_dispatch:
    inputs:
      lane:
        description: Upstream sync lane, or current main for a code-only release
        required: true
        default: core
        type: choice
        options:
          - current
          - core
          - perf

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-bump-dae-daed
  cancel-in-progress: false

env:
  STAGING: auto-bump-staging-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  recover:
    name: Resume unfinished release
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_UNATTENDED_RELEASE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      mode: ${{ steps.state.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install rclone (pinned)
        if: github.event_name == 'schedule'
        env:
          RCLONE_VER: "1.69.1"
        run: |
          set -euo pipefail
          zip="rclone-v${RCLONE_VER}-linux-amd64.zip"
          base="https://downloads.rclone.org/v${RCLONE_VER}"
          curl -fsSL -o "$zip" "${base}/${zip}"
          curl -fsSL -o SHA256SUMS "${base}/SHA256SUMS"
          grep " ${zip}$" SHA256SUMS | sha256sum -c -
          unzip -q "$zip"
          sudo install -m 0755 "rclone-v${RCLONE_VER}-linux-amd64/rclone" /usr/local/bin/rclone

      - name: Check pending candidate
        id: state
        env:
          EVENT_NAME: ${{ github.event_name }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo 'mode=new' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            [ -n "${!name}" ] || { echo "Missing $name"; exit 1; }
          done
          umask 077
          cat > "$RUNNER_TEMP/daede-rclone.conf" <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          no_check_bucket = true
          EOF
          export RCLONE_CONFIG="$RUNNER_TEMP/daede-rclone.conf"
          state="r2:${R2_BUCKET}/openwrt-feed/daed-release-state"
          rclone lsf "$state/" --files-only > "$RUNNER_TEMP/state-files"
          if ! grep -Fxq pending.json "$RUNNER_TEMP/state-files"; then
            echo 'mode=new' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rclone cat "$state/pending.json" > "$RUNNER_TEMP/pending.json"
          jq -e '.candidate_sha | test("^[0-9a-f]{40}$")' "$RUNNER_TEMP/pending.json" >/dev/null
          sha=$(jq -r '.candidate_sha' "$RUNNER_TEMP/pending.json")
          if rclone cat "$state/completed/${sha}.json" > "$RUNNER_TEMP/completed.json" 2>/dev/null; then
            cmp -s "$RUNNER_TEMP/pending.json" "$RUNNER_TEMP/completed.json" || {
              echo 'Completed release conflicts with pending release'; exit 1;
            }
            rclone deletefile "$state/pending.json"
            echo 'mode=new' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -e '.base_sha | test("^[0-9a-f]{40}$")' "$RUNNER_TEMP/pending.json" >/dev/null
          jq -e '.staging | test("^auto-bump-staging-[0-9]+-[0-9]+$")' "$RUNNER_TEMP/pending.json" >/dev/null
          jq -e '.build_run_id | type == "number"' "$RUNNER_TEMP/pending.json" >/dev/null
          jq -e '.manifest_sha256 | test("^[0-9a-f]{64}$")' "$RUNNER_TEMP/pending.json" >/dev/null
          stage="r2:${R2_BUCKET}/openwrt-feed/daed-candidates/${sha}"
          mkdir -p publish
          rclone copy "$stage/" publish/ --fast-list
          rclone check publish/ "$stage/" --download --fast-list
          expected=$(jq -r '.manifest_sha256' "$RUNNER_TEMP/pending.json")
          actual=$(sha256sum publish/manifest.json | cut -d' ' -f1)
          [ "$expected" = "$actual" ] || { echo 'Candidate manifest changed'; exit 1; }
          echo 'mode=resume' >> "$GITHUB_OUTPUT"
          for key in candidate_sha base_sha staging build_run_id; do
            echo "${key}=$(jq -r ".$key" "$RUNNER_TEMP/pending.json")" >> "$GITHUB_OUTPUT"
          done

      - name: Finish pending release
        if: steps.state.outputs.mode == 'resume'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.state.outputs.base_sha }}
          CANDIDATE_SHA: ${{ steps.state.outputs.candidate_sha }}
          BUILD_RUN_ID: ${{ steps.state.outputs.build_run_id }}
          STAGING: ${{ steps.state.outputs.staging }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AGGREGATE_FEED_TOKEN: ${{ secrets.AGGREGATE_FEED_TOKEN }}
        run: bash scripts/promote-candidate.sh

  bump:
    needs: recover
    if: needs.recover.outputs.mode == 'new'
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.stage.outputs.base_sha }}
      tested_sha: ${{ steps.gate.outputs.tested_sha }}
      gate_run_id: ${{ steps.gate.outputs.gate_run_id }}
      changed: ${{ steps.detect.outputs.changed }}
      staging: ${{ steps.stage.outputs.staging }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select sync lane
        id: lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            lane="$REQUESTED_LANE"
          elif [ "$EVENT_NAME" = schedule ] && [ "$SCHEDULE" = '30 19 * * 0' ]; then
            lane=perf
          else
            lane=core
          fi
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "Selected $lane lane."

      - name: Detect upstream changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ steps.lane.outputs.lane }}
        run: |
          set -euo pipefail
          . ci/pins.env
          changes=""
          require_sha() {
            if ! [[ "$1" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$2 is not a full 40-character commit SHA: ${1:-<empty>}"
              exit 1
            fi
          }
          require_date() {
            if ! [[ "$1" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
              echo "::error::$2 is not YYYY.MM.DD: ${1:-<empty>}"
              exit 1
            fi
          }
          add_change() {
            [ "$2" = "$3" ] && return 0
            changes="${changes:+$changes, }$1 $(printf '%s' "$2" | cut -c1-7)→$(printf '%s' "$3" | cut -c1-7)"
          }
          require_date "$DAE_VERSION" DAE_VERSION

          case "$LANE" in
            current)
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              echo 'changes=current main code' >> "$GITHUB_OUTPUT"
              ;;
            core)
              daed_new=$(git ls-remote https://github.com/daeuniverse/daed HEAD | cut -f1)
              wing_new=$(git ls-remote https://github.com/daeuniverse/dae-wing HEAD | cut -f1)
              # Route A: track upstream dae main (merged onto the frozen olicesx
              # perf base at assemble time), so the core stays fresh.
              core_up_new=$(git ls-remote https://github.com/daeuniverse/dae main | cut -f1)
              require_sha "$daed_new" daed
              require_sha "$wing_new" dae-wing
              require_sha "$core_up_new" dae-core
              if [ "$daed_new" = "$DAED_COMMIT" ] && [ "$wing_new" = "$WING_COMMIT" ] \
                 && [ "$core_up_new" = "$CORE_UPSTREAM_COMMIT" ]; then
                echo "No core upstream change."
                echo "changed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              daed_date=$(gh api "repos/daeuniverse/daed/commits/$daed_new" --jq '.commit.committer.date' | cut -dT -f1 | tr '-' '.')
              wing_date=$(gh api "repos/daeuniverse/dae-wing/commits/$wing_new" --jq '.commit.committer.date' | cut -dT -f1 | tr '-' '.')
              core_date=$(gh api "repos/daeuniverse/dae/commits/$core_up_new" --jq '.commit.committer.date' | cut -dT -f1 | tr '-' '.')
              require_date "$daed_date" daed-date
              require_date "$wing_date" wing-date
              require_date "$core_date" core-date
              ver=$(printf '%s\n%s\n%s\n%s\n' "$DAE_VERSION" "$daed_date" "$wing_date" "$core_date" | sort -r | head -1)
              require_date "$ver" core-version
              add_change daed "$DAED_COMMIT" "$daed_new"
              add_change wing "$WING_COMMIT" "$wing_new"
              add_change core "$CORE_UPSTREAM_COMMIT" "$core_up_new"
              {
                echo "changed=true"
                echo "daed=$daed_new"
                echo "wing=$wing_new"
                echo "core_up=$core_up_new"
                echo "ver=$ver"
                echo "changes=$changes"
              } >> "$GITHUB_OUTPUT"
              ;;
            perf)
              outbound_new=$(git ls-remote https://github.com/olicesx/outbound perf/complete-optimizations | cut -f1)
              require_sha "$outbound_new" outbound
              quicgo_suffix=$(curl -fsSL "https://raw.githubusercontent.com/olicesx/outbound/${outbound_new}/go.mod" \
                | sed -nE '/^replace .*olicesx\/quic-go/ s/.*-([0-9a-f]{12})[[:space:]]*$/\1/p' | tail -1)
              if ! [[ "$quicgo_suffix" =~ ^[0-9a-f]{12}$ ]]; then
                echo "::error::cannot parse the quic-go commit from outbound ${outbound_new}"
                exit 1
              fi
              quicgo_new=$(gh api "repos/olicesx/quic-go/commits/$quicgo_suffix" --jq '.sha')
              require_sha "$quicgo_new" quic-go
              if [ "$outbound_new" = "$OUTBOUND_COMMIT" ] \
                 && [ "$quicgo_new" = "$QUICGO_BASE_COMMIT" ] \
                 && [ "$quicgo_new" = "$QUICGO_PERF_TIP" ]; then
                echo "No perf upstream change."
                echo "changed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              outbound_date=$(gh api "repos/olicesx/outbound/commits/$outbound_new" --jq '.commit.committer.date' | cut -dT -f1 | tr '-' '.')
              quicgo_date=$(gh api "repos/olicesx/quic-go/commits/$quicgo_new" --jq '.commit.committer.date' | cut -dT -f1 | tr '-' '.')
              require_date "$outbound_date" outbound-date
              require_date "$quicgo_date" quic-go-date
              ver=$(printf '%s\n%s\n%s\n' "$DAE_VERSION" "$outbound_date" "$quicgo_date" | sort -r | head -1)
              require_date "$ver" perf-version
              add_change outbound "$OUTBOUND_COMMIT" "$outbound_new"
              if [ "$QUICGO_BASE_COMMIT" != "$quicgo_new" ] \
                 || [ "$QUICGO_PERF_TIP" != "$quicgo_new" ]; then
                old_quicgo="$(printf '%.7s/%.7s' "$QUICGO_BASE_COMMIT" "$QUICGO_PERF_TIP")"
                changes="${changes:+$changes, }quic-go ${old_quicgo}→$(printf '%s' "$quicgo_new" | cut -c1-7)"
              fi
              {
                echo "changed=true"
                echo "outbound=$outbound_new"
                echo "quicgo=$quicgo_new"
                echo "ver=$ver"
                echo "changes=$changes"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unknown sync lane: $LANE"
              exit 1
              ;;
          esac

      - name: Summarize scheduled upstream check
        if: github.event_name == 'schedule'
        env:
          LANE: ${{ steps.lane.outputs.lane }}
          CHANGED: ${{ steps.detect.outputs.changed }}
          CHANGES: ${{ steps.detect.outputs.changes }}
          DAED_SHA: ${{ steps.detect.outputs.daed }}
          WING_SHA: ${{ steps.detect.outputs.wing }}
          CORE_SHA: ${{ steps.detect.outputs.core_up }}
          OUTBOUND_SHA: ${{ steps.detect.outputs.outbound }}
          QUICGO_SHA: ${{ steps.detect.outputs.quicgo }}
        run: |
          if [ "$CHANGED" = true ]; then
            echo "::warning::Upstream update pending compatibility review: $CHANGES"
          fi
          {
            echo "## $LANE upstream check"
            if [ "$CHANGED" = true ]; then
              echo "Pending review: $CHANGES"
              if [ "$LANE" = core ]; then
                echo "daed: \`$DAED_SHA\`"
                echo "dae-wing: \`$WING_SHA\`"
                echo "dae core: \`$CORE_SHA\`"
              else
                echo "outbound: \`$OUTBOUND_SHA\`"
                echo "quic-go: \`$QUICGO_SHA\`"
              fi
              echo "A candidate will be assembled and validated in this run."
            else
              echo "No upstream change."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@v6
        if: steps.detect.outputs.changed == 'true'
        with:
          go-version: "1.27.3"

      - name: Sync kenzok8 forks from olicesx
        if: steps.detect.outputs.changed == 'true' && steps.lane.outputs.lane != 'current'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          LANE: ${{ steps.lane.outputs.lane }}
          QUICGO_COMMIT: ${{ steps.detect.outputs.quicgo }}
        run: |
          set -euo pipefail
          if [ "$LANE" = core ]; then
            # Mirror kdae as delete-insurance; builds still pin frozen CORE_COMMIT.
            gh repo sync kenzok8/dae -b kdae --source olicesx/dae --force
            exit 0
          fi
          if ! [[ "$QUICGO_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::quic-go is not a full 40-character commit SHA: ${QUICGO_COMMIT:-<empty>}"
            exit 1
          fi

          gh repo sync kenzok8/outbound -b perf/complete-optimizations --source olicesx/outbound --force
          # Keep every pinned quic-go object on an immutable fork ref; the short
          # alias is only a convenience and is never its sole long-term reference.
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          git init -q "$temp_dir/quic-go"
          git -C "$temp_dir/quic-go" remote add upstream https://github.com/olicesx/quic-go.git
          git -C "$temp_dir/quic-go" fetch -q --no-tags --depth=1 upstream "$QUICGO_COMMIT"
          fetched_quicgo=$(git -C "$temp_dir/quic-go" rev-parse FETCH_HEAD)
          if ! [[ "$fetched_quicgo" =~ ^[0-9a-f]{40}$ ]] || [ "$fetched_quicgo" != "$QUICGO_COMMIT" ]; then
            echo "::error::fetched quic-go $fetched_quicgo, expected $QUICGO_COMMIT"
            exit 1
          fi
          git -C "$temp_dir/quic-go" remote add origin https://github.com/kenzok8/quic-go.git
          immutable_branch="daede-pinned-${QUICGO_COMMIT}"
          immutable_sha=$(git -C "$temp_dir/quic-go" ls-remote --heads origin "refs/heads/$immutable_branch" | cut -f1)
          if [ -n "$immutable_sha" ]; then
            if ! [[ "$immutable_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$immutable_branch resolved to an invalid SHA: $immutable_sha"
              exit 1
            fi
            if [ "$immutable_sha" != "$QUICGO_COMMIT" ]; then
              echo "::error::$immutable_branch already points to $immutable_sha, expected $QUICGO_COMMIT"
              exit 1
            fi
            echo "$immutable_branch already preserves $QUICGO_COMMIT."
          else
            git -C "$temp_dir/quic-go" -c credential.helper='!gh auth git-credential' \
              push origin "FETCH_HEAD:refs/heads/$immutable_branch"
          fi
          git -C "$temp_dir/quic-go" -c credential.helper='!gh auth git-credential' \
            push --force origin "FETCH_HEAD:refs/heads/daede-pinned"

      - name: Stage new pins
        id: stage
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ steps.lane.outputs.lane }}
          V: ${{ steps.detect.outputs.ver }}
        run: |
          set -euo pipefail
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          case "$LANE" in
            current) ;;
            core)
              sed -i \
                -e "s/^DAE_VERSION=.*/DAE_VERSION=$V/" \
                -e "s/^DAED_VERSION=.*/DAED_VERSION=$V/" \
                -e "s/^DAED_COMMIT=.*/DAED_COMMIT=${{ steps.detect.outputs.daed }}/" \
                -e "s/^WING_COMMIT=.*/WING_COMMIT=${{ steps.detect.outputs.wing }}/" \
                -e "s/^CORE_UPSTREAM_COMMIT=.*/CORE_UPSTREAM_COMMIT=${{ steps.detect.outputs.core_up }}/" \
                ci/pins.env
              ;;
            perf)
              sed -i \
                -e "s/^DAE_VERSION=.*/DAE_VERSION=$V/" \
                -e "s/^DAED_VERSION=.*/DAED_VERSION=$V/" \
                -e "s/^OUTBOUND_COMMIT=.*/OUTBOUND_COMMIT=${{ steps.detect.outputs.outbound }}/" \
                -e "s/^QUICGO_BASE_COMMIT=.*/QUICGO_BASE_COMMIT=${{ steps.detect.outputs.quicgo }}/" \
                -e "s/^QUICGO_PERF_TIP=.*/QUICGO_PERF_TIP=${{ steps.detect.outputs.quicgo }}/" \
                ci/pins.env
              ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$STAGING"
          if [ "$LANE" != current ]; then
            git add ci/pins.env
            git commit -m "Bump upstream pins" \
              -m "改动：将 $LANE 上游 pin 更新至 $V，并固定依赖提交。" \
              -m "原因：让候选构建使用可追溯的上游版本。"
          fi
          staging_sha=$(git rev-parse HEAD)
          if ! [[ "$staging_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::staging commit is not a full 40-character SHA: $staging_sha"
            exit 1
          fi
          git -c credential.helper='!gh auth git-credential' \
            push --force origin "HEAD:refs/heads/$STAGING"
          echo "staging_sha=$staging_sha" >> "$GITHUB_OUTPUT"
          echo "staging=$STAGING" >> "$GITHUB_OUTPUT"

      - name: Assemble + gate build on staging
        id: gate
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_SHA: ${{ steps.stage.outputs.staging_sha }}
          LANE: ${{ steps.lane.outputs.lane }}
          BASE_SHA: ${{ steps.stage.outputs.base_sha }}
        run: |
          set -euo pipefail
          require_sha() {
            if ! [[ "$1" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$2 is not a full 40-character commit SHA: ${1:-<empty>}"
              exit 1
            fi
          }
          fetch_staging_sha() {
            git fetch -q --force origin "refs/heads/$STAGING"
            fetched_sha=$(git rev-parse FETCH_HEAD)
            require_sha "$fetched_sha" staging
            printf '%s\n' "$fetched_sha"
          }
          wait_run() {
            local id=$1 fails=0 out status conclusion
            while :; do
              if out=$(gh run view "$id" --json status,conclusion --jq '.status + " " + (.conclusion // "")' 2>&1); then
                fails=0
                read -r status conclusion <<<"$out"
                if [ "$status" = completed ]; then
                  echo "run $id finished: $conclusion"
                  if [ "$conclusion" != success ]; then
                    echo "::error::run $id concluded $conclusion"
                    return 1
                  fi
                  return 0
                fi
              else
                fails=$((fails + 1))
                echo "::warning::polling run $id failed ($fails/20): $out"
                if [ "$fails" -ge 20 ]; then
                  echo "::error::cannot poll run $id"
                  return 1
                fi
              fi
              sleep 30
            done
          }
          run_and_wait() { # <ref> <workflow-file> <expected-sha> [dispatch args...]
            ref=$1
            workflow=$2
            expected_sha=$3
            shift 3
            require_sha "$expected_sha" "$workflow expected head"
            if [[ "$ref" == candidate/* ]]; then
              tag_sha=$(git ls-remote origin "refs/tags/$ref" | cut -f1)
              require_sha "$tag_sha" "candidate tag $ref"
              if [ "$tag_sha" != "$expected_sha" ]; then
                echo "::error::candidate tag $ref points at $tag_sha, expected $expected_sha"
                exit 1
              fi
            else
              remote_sha=$(fetch_staging_sha)
              if [ "$remote_sha" != "$expected_sha" ]; then
                echo "::error::$STAGING moved to $remote_sha before dispatching $workflow; expected $expected_sha"
                exit 1
              fi
            fi
            dispatch_output=$(gh workflow run "$workflow" --ref "$ref" "$@")
            echo "$dispatch_output"
            run_id=$(printf '%s\n' "$dispatch_output" \
              | sed -nE 's|.*actions/runs/([0-9]+).*|\1|p' | tail -1)
            if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
              echo "::error::cannot read dispatched $workflow run ID"
              exit 1
            fi
            actual_sha=""
            for _ in {1..60}; do
              if actual_sha=$(gh run view "$run_id" --json headSha --jq '.headSha' 2>/dev/null); then
                break
              fi
              sleep 2
            done
            require_sha "$actual_sha" "$workflow run head"
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "::error::$workflow run $run_id uses $actual_sha, expected $expected_sha"
              exit 1
            fi
            echo "watching $workflow run $run_id at $expected_sha"
            wait_run "$run_id"
            LAST_RUN_ID=$run_id
            LAST_RUN_ATTEMPT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.run_attempt')
            if ! [[ "$LAST_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
              echo "::error::cannot read attempt for run $run_id"
              exit 1
            fi
            echo "run $run_id attempt $LAST_RUN_ATTEMPT"
          }

          require_sha "$INITIAL_SHA" initial-staging
          current_sha=$(fetch_staging_sha)
          if [ "$current_sha" != "$INITIAL_SHA" ]; then
            echo "::error::$STAGING starts at $current_sha, expected $INITIAL_SHA"
            exit 1
          fi
          if [ "$LANE" != current ]; then
            run_and_wait "$STAGING" assemble-dae-src.yml "$current_sha"
            ASSEMBLE_DAE_RUN_ID=$LAST_RUN_ID
            ASSEMBLE_DAE_ATTEMPT=$LAST_RUN_ATTEMPT
            ASSEMBLE_DAE_HEAD_SHA=$current_sha
            current_sha=$(fetch_staging_sha)
            run_and_wait "$STAGING" assemble-daed-src.yml "$current_sha"
            ASSEMBLE_DAED_RUN_ID=$LAST_RUN_ID
            ASSEMBLE_DAED_ATTEMPT=$LAST_RUN_ATTEMPT
            ASSEMBLE_DAED_HEAD_SHA=$current_sha
          fi
          # 冻结点：assemble 完成后固定 candidate SHA。
          # 后续所有验证都针对 candidate tag，保证"验证的是哪个 SHA"可查。
          tested_sha=$(fetch_staging_sha)
          require_sha "$tested_sha" candidate
          candidate_tag="candidate/$tested_sha"
          existing_tag=$(git ls-remote origin "refs/tags/$candidate_tag" | cut -f1)
          if [ -n "$existing_tag" ]; then
            [ "$existing_tag" = "$tested_sha" ] || {
              echo "::error::$candidate_tag points at $existing_tag, expected $tested_sha"
              exit 1
            }
          else
            git tag "$candidate_tag" "$tested_sha"
            git -c credential.helper='!gh auth git-credential' push origin "refs/tags/$candidate_tag"
          fi
          echo "candidate frozen at $tested_sha (tag $candidate_tag)"
          # audit 独立 workflow，对 candidate SHA 审计（结论可寻址、可核对）。
          run_and_wait "$candidate_tag" audit-upstream.yml "$tested_sha" -f sha="$tested_sha"
          AUDIT_RUN_ID=$LAST_RUN_ID
          AUDIT_ATTEMPT=$LAST_RUN_ATTEMPT
          # A single real SDK build catches wing/core compile errors before the
          # full matrix. The test workflow also checks for both package files.
          run_and_wait "$candidate_tag" test-daed-build.yml "$tested_sha" -f sha="$tested_sha" -f packages="dae daed" -f arch=x86_64 -f sdk=25.12
          SMOKE_RUN_ID=$LAST_RUN_ID
          SMOKE_ATTEMPT=$LAST_RUN_ATTEMPT
          # Build the exact four-package release matrix without publishing.
          run_and_wait "$candidate_tag" release.yml "$tested_sha" -f sha="$tested_sha"
          gate_run_id=$LAST_RUN_ID
          MATRIX_RUN_ID=$gate_run_id
          MATRIX_ATTEMPT=$LAST_RUN_ATTEMPT
          # 写验证记录：每项验证的 workflow / run / attempt / headSha。
          # 这只是关联信息；证明来自 promote 对 GitHub API 的核对。
          export CANDIDATE_SHA="$tested_sha" AUTO_BUMP_RUN_ID="${{ github.run_id }}"
          export AUTO_BUMP_RUN_ATTEMPT="${{ github.run_attempt }}"
          export LANE BASE_SHA STAGING
          export ASSEMBLE_DAE_RUN_ID ASSEMBLE_DAE_ATTEMPT ASSEMBLE_DAE_HEAD_SHA
          export ASSEMBLE_DAED_RUN_ID ASSEMBLE_DAED_ATTEMPT ASSEMBLE_DAED_HEAD_SHA
          export AUDIT_RUN_ID AUDIT_ATTEMPT SMOKE_RUN_ID SMOKE_ATTEMPT
          export MATRIX_RUN_ID MATRIX_ATTEMPT
          python3 <<'PYEOF' > verification.json
          import json, os
          def v(step, workflow, run, attempt, head):
              return {"step": step, "workflow": workflow,
                      "run_id": int(os.environ[run]),
                      "attempt": int(os.environ[attempt]),
                      "head_sha": os.environ[head],
                      "conclusion": "success"}
          record = {
              "schema_version": 2,
              "kind": "main" if os.environ["LANE"] == "current" else "upstream",
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "base_sha": os.environ["BASE_SHA"],
              "staging": os.environ["STAGING"],
              "auto_bump_run_id": int(os.environ["AUTO_BUMP_RUN_ID"]),
              "auto_bump_run_attempt": int(os.environ["AUTO_BUMP_RUN_ATTEMPT"]),
              "verifications": ([
                  v("assemble-dae", ".github/workflows/assemble-dae-src.yml",
                    "ASSEMBLE_DAE_RUN_ID", "ASSEMBLE_DAE_ATTEMPT",
                    "ASSEMBLE_DAE_HEAD_SHA"),
                  v("assemble-daed", ".github/workflows/assemble-daed-src.yml",
                    "ASSEMBLE_DAED_RUN_ID", "ASSEMBLE_DAED_ATTEMPT",
                    "ASSEMBLE_DAED_HEAD_SHA"),
              ] if os.environ["LANE"] != "current" else []) + [
                  v("audit", ".github/workflows/audit-upstream.yml",
                    "AUDIT_RUN_ID", "AUDIT_ATTEMPT", "CANDIDATE_SHA"),
                  v("smoke", ".github/workflows/test-daed-build.yml",
                    "SMOKE_RUN_ID", "SMOKE_ATTEMPT", "CANDIDATE_SHA"),
                  v("matrix", ".github/workflows/release.yml",
                    "MATRIX_RUN_ID", "MATRIX_ATTEMPT", "CANDIDATE_SHA"),
              ],
          }
          print(json.dumps(record, indent=2))
          PYEOF
          cat verification.json
          after_gate_sha=$(fetch_staging_sha)
          if [ "$after_gate_sha" != "$tested_sha" ]; then
            echo "::error::$STAGING moved to $after_gate_sha after gate tested $tested_sha"
            exit 1
          fi
          rm -rf gate-artifacts
          mkdir -p gate-artifacts
          artifacts=(
            packages-sdk24.10-aarch64_cortex-a53
            packages-sdk25.12-aarch64_cortex-a53
            packages-sdk24.10-aarch64_cortex-a72
            packages-sdk25.12-aarch64_cortex-a72
            packages-sdk24.10-aarch64_generic
            packages-sdk25.12-aarch64_generic
            packages-sdk24.10-arm_cortex-a7_neon-vfpv4
            packages-sdk25.12-arm_cortex-a7_neon-vfpv4
            packages-sdk24.10-arm_cortex-a9
            packages-sdk25.12-arm_cortex-a9
            packages-sdk24.10-arm_cortex-a9_neon
            packages-sdk25.12-arm_cortex-a9_neon
            packages-sdk24.10-i386_pentium4
            packages-sdk25.12-i386_pentium4
            packages-sdk24.10-x86_64
            packages-sdk25.12-x86_64
          )
          for artifact in "${artifacts[@]}"; do
            gh run download "$gate_run_id" --name "$artifact" --dir "gate-artifacts/$artifact"
            [ -d "gate-artifacts/$artifact" ] || {
              echo "::error::missing downloaded artifact directory: $artifact"
              exit 1
            }
            for package in dae daed luci-app-daede vmlinux-btf; do
              found=0
              while IFS= read -r -d '' file; do
                name=${file##*/}
                case "$name" in
                  "$package"-*.apk|"$package"_*.apk|"$package"-*.ipk|"$package"_*.ipk)
                    found=1
                    break
                    ;;
                esac
              done < <(find "gate-artifacts/$artifact/feed" -maxdepth 1 -type f \( -name '*.apk' -o -name '*.ipk' \) -print0)
              [ "$found" -eq 1 ] || {
                echo "::error::$artifact has no $package package artifact"
                exit 1
              }
            done
          done
          echo "validated exact package artifacts: ${artifacts[*]}"
          echo "tested_sha=$tested_sha" >> "$GITHUB_OUTPUT"
          echo "gate_run_id=$gate_run_id" >> "$GITHUB_OUTPUT"
          {
            echo "## Candidate ready for 252 testing"
            echo "Staging branch: \`$STAGING\`"
            echo "Validated commit: \`$tested_sha\`"
            echo "Publish via Promote verified daede candidate with candidate_sha=\`$tested_sha\`."
            echo "16 SDK package sets contain dae, daed, luci-app-daede, and vmlinux-btf."
            if [ "${{ github.event_name }}" = schedule ]; then
              echo "Automatic promotion will reuse these exact package artifacts."
            else
              echo "Manual candidate: test on 252 before promotion."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification record
        id: verify_upload
        if: steps.gate.outputs.tested_sha != ''
        env:
          CANDIDATE_SHA: ${{ steps.gate.outputs.tested_sha }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          # 安装 rclone（pinned，与其他步骤一致；下载阶段不持 secret）
          zip="rclone-v1.69.1-linux-amd64.zip"
          base="https://downloads.rclone.org/v1.69.1"
          curl -fsSL -o "$zip" "${base}/${zip}"
          curl -fsSL -o SHA256SUMS "${base}/SHA256SUMS"
          grep " ${zip}$" SHA256SUMS | sha256sum -c -
          unzip -q "$zip"
          sudo install -m 0755 "rclone-v1.69.1-linux-amd64/rclone" /usr/local/bin/rclone
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          no_check_bucket = true
          EOF
          dest="r2:${R2_BUCKET}/openwrt-feed/daed-candidates/${CANDIDATE_SHA}/verification.json"
          # immutable：已存在且内容不同则失败，防止覆盖
          if rclone lsf "r2:${R2_BUCKET}/openwrt-feed/daed-candidates/${CANDIDATE_SHA}/" --files-only 2>/dev/null | grep -Fxq verification.json; then
            rclone cat "$dest" | cmp -s - verification.json || {
              echo "::error::verification.json already exists with different content"
              exit 1
            }
            echo "verification.json already uploaded, identical"
          else
            rclone copyto verification.json "$dest" --immutable --checksum
            echo "uploaded verification.json for $CANDIDATE_SHA"
          fi

  promote:
    name: Publish validated candidate
    needs: bump
    if: github.event_name == 'schedule' && needs.bump.outputs.changed == 'true' && vars.ENABLE_UNATTENDED_RELEASE == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # 自动晋升与手动晋升共用实现：dispatch promote-candidate.yml 并等待。
      # promote-candidate.yml 用了独立的 concurrency group，
      # 不会与本 run 的 auto-bump-dae-daed 组死锁；真正的互斥由
      # promote-candidate.sh 的 pending.json 槽位保证。
      - name: Dispatch candidate promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url=$(gh workflow run promote-candidate.yml --ref main \
            -f candidate_sha="${{ needs.bump.outputs.tested_sha }}")
          echo "$url"
          run_id=$(printf '%s\n' "$url" | sed -nE 's|.*/runs/([0-9]+).*|\1|p' | tail -1)
          [[ "$run_id" =~ ^[0-9]+$ ]] || {
            echo "::error::cannot read promote run ID from: $url"
            exit 1
          }
          echo "promote run: $run_id"
          gh run watch "$run_id" --exit-status
