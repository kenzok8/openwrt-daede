name: vmlinux-btf sync check

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare with kenzok8/vmlinux-btf
        run: |
          curl -fsSL https://raw.githubusercontent.com/kenzok8/vmlinux-btf/main/vmlinux-btf/Makefile \
            -o "$RUNNER_TEMP/upstream.Makefile"
          if ! diff -u vmlinux-btf/Makefile "$RUNNER_TEMP/upstream.Makefile"; then
            echo "::error::vmlinux-btf/Makefile 与 kenzok8/vmlinux-btf 不一致，先同步再发版"
            exit 1
          fi
